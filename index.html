<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Bluesky Audio Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      padding-bottom: 100px;
    }

    .container {
      max-width: 1300px;
      margin: auto;
      padding: 28px;
    }

    h1 {
      margin-bottom: 24px;
    }

    .show-grid {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .show-card {
      width: 160px;
      background: rgba(255,255,255,0.06);
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
    }

    .show-card:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-2px);
    }

    .show-card img {
      width: 82px;
      height: 82px;
      border-radius: 14px;
      object-fit: cover;
      margin-bottom: 12px;
      background: #1f2937;
    }

    .show-name {
      font-weight: bold;
      font-size: 14px;
    }

    .show-handle {
      font-size: 12px;
      opacity: 0.65;
      margin-top: 4px;
    }

    .back-btn {
      margin-bottom: 20px;
    }

    .main {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 22px;
    }

    .player {
      background: rgba(255,255,255,0.05);
      border-radius: 22px;
      overflow: hidden;
    }

    .hero {
      position: relative;
      height: 480px;
      background: #020617;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 25px;
      background: linear-gradient(transparent, rgba(0,0,0,0.88));
    }

    .episodes {
      background: rgba(255,255,255,0.05);
      border-radius: 22px;
      padding: 15px;
      max-height: 760px;
      overflow-y: auto;
    }

    .episode {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 16px;
      cursor: pointer;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.04);
    }

    .episode:hover {
      background: rgba(255,255,255,0.10);
    }

    .episode.active {
      background: white;
      color: black;
    }

    .episode img {
      width: 95px;
      height: 95px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      background: #1f2937;
    }

    .episode-content {
      flex: 1;
      min-width: 0;
    }

    .episode-title {
      font-size: 14px;
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .episode-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.75;
    }

    .empty-message {
      opacity: 0.75;
      padding: 20px;
      line-height: 1.5;
    }

    .bottom-player {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 88px;
      background: #020617;
      border-top: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 10px 22px;
      box-sizing: border-box;
      z-index: 999;
    }

    .bottom-player img {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
      background: #1f2937;
      flex-shrink: 0;
    }

    .now-playing {
      font-size: 11px;
      opacity: 0.6;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .bottom-title {
      width: 340px;
      font-size: 14px;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    button {
      background: #2563eb;
      border: none;
      color: white;
      padding: 9px 15px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .progress-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      opacity: 0.85;
      min-width: 180px;
    }

    .volume-wrap {
      width: 120px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      opacity: 0.85;
    }

    input[type="range"] {
      width: 100%;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 900px) {
      .main {
        grid-template-columns: 1fr;
      }

      .hero {
        height: 360px;
      }

      .bottom-player {
        flex-wrap: wrap;
        align-items: flex-start;
      }

      .bottom-title {
        width: 220px;
      }

      body {
        padding-bottom: 170px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <section id="selectionPage">
    <h1>Explore Shows</h1>
    <div id="showGrid" class="show-grid"></div>
  </section>

  <section id="playerPage" class="hidden">
    <button class="back-btn" onclick="goHome()">← Back to Shows</button>

    <h1 id="profileName">Loading...</h1>

    <div class="main">
      <div class="player">
        <div class="hero">
          <img id="heroImage" src="">
          <div class="overlay">
            <h2 id="title">Choose an episode from the list</h2>
          </div>
        </div>
      </div>

      <div class="episodes" id="episodes"></div>
    </div>
  </section>

</div>

<div class="bottom-player">
  <img id="miniImage" src="">

  <div>
    <div class="now-playing">Now Playing</div>
    <div class="bottom-title" id="miniTitle">Choose an episode to play</div>
  </div>

  <div class="controls">
    <button onclick="prevTrack()">Prev</button>
    <button id="playPauseBtn" onclick="togglePlay()">Play</button>
    <button onclick="nextTrack()">Next</button>
  </div>

  <div class="progress-wrap">
    <span id="currentTime">0:00</span>
    <input type="range" id="progress" value="0" min="0">
    <span id="duration">0:00</span>
  </div>

  <div class="volume-wrap">
    <span>Vol</span>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.85">
  </div>

  <audio id="audio"></audio>
</div>

<script>
const API = "https://public.api.bsky.app/xrpc";

/*
  Manually edit this list to choose which shows appear
  on the Explore Shows selection page.
*/
const featuredShows = [
  "npr.org",
  "bbcnews.bsky.social",
  "nytimes.com",
  "washingtonpost.com",
  "guardian.bsky.social"
];

let shows = [];
let episodes = [];
let current = -1;
let currentActor = "";

const audio = document.getElementById("audio");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");

audio.volume = Number(volume.value);

function formatTime(sec) {
  if (!Number.isFinite(sec)) return "0:00";

  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, "0");

  return `${m}:${s}`;
}

function timeAgo(date) {
  const diff = Math.floor((new Date() - date) / 1000);
  const days = Math.floor(diff / 86400);
  const hours = Math.floor(diff / 3600);
  const minutes = Math.floor(diff / 60);

  if (days > 0) return `${days}D AGO`;
  if (hours > 0) return `${hours}H AGO`;
  if (minutes > 0) return `${minutes}M AGO`;

  return "JUST NOW";
}

function getVideo(embed) {
  if (!embed) return null;

  if (embed.$type === "app.bsky.embed.video#view") {
    return embed;
  }

  if (
    embed.$type === "app.bsky.embed.recordWithMedia#view" &&
    embed.media?.$type === "app.bsky.embed.video#view"
  ) {
    return embed.media;
  }

  return null;
}

async function loadShows() {
  const grid = document.getElementById("showGrid");
  grid.innerHTML = "Loading shows...";

  shows = [];

  for (const handle of featuredShows) {
    try {
      const res = await fetch(
        `${API}/app.bsky.actor.getProfile?actor=${encodeURIComponent(handle)}`
      );

      const profile = await res.json();

      shows.push({
        handle,
        name: profile.displayName || handle,
        avatar: profile.avatar || "",
        description: profile.description || ""
      });

    } catch (e) {
      shows.push({
        handle,
        name: handle,
        avatar: "",
        description: ""
      });
    }
  }

  renderShows();
}

function renderShows() {
  const grid = document.getElementById("showGrid");
  grid.innerHTML = "";

  shows.forEach(show => {
    const card = document.createElement("div");
    card.className = "show-card";

    card.innerHTML = `
      <img src="${show.avatar}">
      <div class="show-name">${show.name}</div>
      <div class="show-handle">@${show.handle}</div>
    `;

    card.onclick = () => openShow(show.handle);
    grid.appendChild(card);
  });
}

async function openShow(actor) {
  currentActor = actor;
  current = -1;

  document.getElementById("selectionPage").classList.add("hidden");
  document.getElementById("playerPage").classList.remove("hidden");

  document.getElementById("profileName").innerText = "Loading...";
  document.getElementById("title").innerText = "Choose an episode from the list";
  document.getElementById("heroImage").src = "";
  document.getElementById("episodes").innerHTML = "Loading episodes...";

  await loadFeed(actor);
}

function goHome() {
  document.getElementById("playerPage").classList.add("hidden");
  document.getElementById("selectionPage").classList.remove("hidden");
}

async function loadFeed(actor) {
  try {
    const profileRes = await fetch(
      `${API}/app.bsky.actor.getProfile?actor=${encodeURIComponent(actor)}`
    );

    const profile = await profileRes.json();

    document.getElementById("profileName").innerText =
      profile.displayName || actor;

    const feedRes = await fetch(
      `${API}/app.bsky.feed.getAuthorFeed?actor=${encodeURIComponent(actor)}&filter=posts_with_media&limit=30`
    );

    const data = await feedRes.json();

    episodes = data.feed
      .map(x => x.post)
      .map(post => {
        const video = getVideo(post.embed);

        if (!video?.playlist) return null;

        return {
          title: post.record.text || "Untitled",
          thumbnail: video.thumbnail || post.author.avatar,
          playlist: video.playlist,
          date: post.record.createdAt,
          duration: "..."
        };
      })
      .filter(Boolean);

    current = -1;

    if (!episodes.length) {
      document.getElementById("episodes").innerHTML =
        `<div class="empty-message">No playable video/audio posts found for this show.</div>`;
      return;
    }

    renderEpisodes();
    loadAllDurations();

  } catch (e) {
    document.getElementById("episodes").innerHTML =
      `<div class="empty-message">Failed to load episodes. Please try another show.</div>`;
  }
}

function renderEpisodes() {
  const wrap = document.getElementById("episodes");
  wrap.innerHTML = "";

  episodes.forEach((ep, i) => {
    const div = document.createElement("div");
    div.className = "episode" + (i === current ? " active" : "");

    const dateText = ep.date ? timeAgo(new Date(ep.date)) : "";

    div.innerHTML = `
      <img src="${ep.thumbnail}">
      <div class="episode-content">
        <div class="episode-title">${ep.title}</div>
        <div class="episode-meta">
          <div>${dateText}</div>
          <div>${ep.duration || "..."}</div>
        </div>
      </div>
    `;

    div.onclick = () => loadEpisode(i);
    wrap.appendChild(div);
  });
}

function loadEpisode(index) {
  current = index;
  const ep = episodes[index];

  if (!ep) return;

  renderEpisodes();

  document.getElementById("heroImage").src = ep.thumbnail;
  document.getElementById("title").innerText = ep.title;

  document.getElementById("miniImage").src = ep.thumbnail;
  document.getElementById("miniTitle").innerText = ep.title;

  progress.value = 0;
  document.getElementById("currentTime").innerText = "0:00";
  document.getElementById("duration").innerText = ep.duration || "0:00";

  if (window.hlsInstance) {
    window.hlsInstance.destroy();
  }

  if (Hls.isSupported()) {
    const hls = new Hls();

    hls.loadSource(ep.playlist);
    hls.attachMedia(audio);

    window.hlsInstance = hls;

  } else {
    audio.src = ep.playlist;
  }

  audio.play();
}

function loadAllDurations() {
  episodes.forEach((ep, index) => {
    const tempAudio = document.createElement("audio");

    if (Hls.isSupported()) {
      const hls = new Hls();

      hls.loadSource(ep.playlist);
      hls.attachMedia(tempAudio);

      tempAudio.addEventListener("loadedmetadata", () => {
        episodes[index].duration = formatTime(tempAudio.duration);
        renderEpisodes();
        hls.destroy();
      });

      tempAudio.addEventListener("error", () => {
        episodes[index].duration = "";
        renderEpisodes();
        hls.destroy();
      });

    } else {
      tempAudio.src = ep.playlist;

      tempAudio.addEventListener("loadedmetadata", () => {
        episodes[index].duration = formatTime(tempAudio.duration);
        renderEpisodes();
      });

      tempAudio.addEventListener("error", () => {
        episodes[index].duration = "";
        renderEpisodes();
      });
    }
  });
}

function togglePlay() {
  if (!audio.src && !window.hlsInstance && current < 0) {
    if (episodes.length) {
      loadEpisode(0);
    }
    return;
  }

  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

function nextTrack() {
  if (!episodes.length) return;

  current = current < 0
    ? 0
    : (current + 1) % episodes.length;

  loadEpisode(current);
}

function prevTrack() {
  if (!episodes.length) return;

  current = current < 0
    ? 0
    : (current - 1 + episodes.length) % episodes.length;

  loadEpisode(current);
}

audio.addEventListener("play", () => {
  document.getElementById("playPauseBtn").innerText = "Pause";
});

audio.addEventListener("pause", () => {
  document.getElementById("playPauseBtn").innerText = "Play";
});

audio.addEventListener("ended", () => {
  nextTrack();
});

audio.addEventListener("timeupdate", () => {
  progress.value = audio.currentTime;

  document.getElementById("currentTime").innerText =
    formatTime(audio.currentTime);
});

audio.addEventListener("loadedmetadata", () => {
  progress.max = audio.duration;

  document.getElementById("duration").innerText =
    formatTime(audio.duration);

  if (episodes[current]) {
    episodes[current].duration = formatTime(audio.duration);
    renderEpisodes();
  }
});

progress.addEventListener("input", () => {
  audio.currentTime = progress.value;
});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

loadShows();
</script>

</body>
</html>
