<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Bluesky Audio Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom right, #0f172a, #111827);
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1300px;
      margin: auto;
      padding: 25px;
    }

    .header {
      display: flex;
      gap: 18px;
      align-items: center;
      margin-bottom: 30px;
    }

    .profile {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: cover;
    }

    .main {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 22px;
    }

    .player {
      background: rgba(255,255,255,0.05);
      border-radius: 22px;
      overflow: hidden;
    }

    .hero {
      position: relative;
      height: 480px;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 25px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
    }

    .controls {
      padding: 22px;
    }

    .controls-top {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    button {
      background: #2563eb;
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 12px;
    }

    .time {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      opacity: 0.8;
      margin-top: 6px;
    }

    .episodes {
      background: rgba(255,255,255,0.05);
      border-radius: 22px;
      padding: 15px;
      max-height: 760px;
      overflow-y: auto;
    }

    .episode {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 16px;
      cursor: pointer;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.04);
    }

    .episode:hover {
      background: rgba(255,255,255,0.10);
    }

    .episode.active {
      background: white;
      color: black;
    }

    .episode img {
      width: 95px;
      height: 95px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .episode-content {
      flex: 1;
      min-width: 0;
    }

    .episode-title {
      font-size: 14px;
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .episode-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.75;
    }

    .small {
      opacity: 0.7;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <img id="profileImage" class="profile">
    <div>
      <h1 id="profileName">Loading...</h1>
      <div class="small">Bluesky podcast/audio player</div>
    </div>
  </div>

  <div class="main">

    <div class="player">
      <div class="hero">
        <img id="heroImage">
        <div class="overlay">
          <h2 id="title"></h2>
        </div>
      </div>

      <div class="controls">
        <audio id="audio"></audio>

        <div class="controls-top">
          <button onclick="prevTrack()">Prev</button>
          <button id="playPauseBtn" onclick="togglePlay()">Play</button>
          <button onclick="nextTrack()">Next</button>
        </div>

        <input type="range" id="progress" value="0">

        <div class="time">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>
    </div>

    <div class="episodes" id="episodes"></div>

  </div>

</div>

<script>
const API = "https://public.api.bsky.app/xrpc";
const actor = "npr.org";

let episodes = [];
let current = 0;

const audio = document.getElementById("audio");
const progress = document.getElementById("progress");

function formatTime(sec) {
  if (!Number.isFinite(sec)) return "0:00";

  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60)
    .toString()
    .padStart(2, "0");

  return `${m}:${s}`;
}

function timeAgo(date) {
  const now = new Date();
  const diff = Math.floor((now - date) / 1000);

  const days = Math.floor(diff / 86400);
  const hours = Math.floor(diff / 3600);
  const minutes = Math.floor(diff / 60);

  if (days > 0) return `${days}D AGO`;
  if (hours > 0) return `${hours}H AGO`;
  if (minutes > 0) return `${minutes}M AGO`;

  return "JUST NOW";
}

function getVideo(embed) {
  if (!embed) return null;

  if (embed.$type === "app.bsky.embed.video#view") {
    return embed;
  }

  if (
    embed.$type === "app.bsky.embed.recordWithMedia#view" &&
    embed.media?.$type === "app.bsky.embed.video#view"
  ) {
    return embed.media;
  }

  return null;
}

async function loadFeed() {
  const profileRes = await fetch(
    `${API}/app.bsky.actor.getProfile?actor=${actor}`
  );

  const profile = await profileRes.json();

  document.getElementById("profileImage").src = profile.avatar;
  document.getElementById("profileName").innerText = profile.displayName;

  const feedRes = await fetch(
    `${API}/app.bsky.feed.getAuthorFeed?actor=${actor}&filter=posts_with_media&limit=30`
  );

  const data = await feedRes.json();

  episodes = data.feed
    .map(x => x.post)
    .map(post => {
      const video = getVideo(post.embed);

      if (!video?.playlist) return null;

      return {
        title: post.record.text || "Untitled",
        thumbnail: video.thumbnail || post.author.avatar,
        playlist: video.playlist,
        date: post.record.createdAt,
        duration: "..."
      };
    })
    .filter(Boolean);

  renderEpisodes();
  loadAllDurations();

  if (episodes.length) {
    loadEpisode(0);
  }
}

function renderEpisodes() {
  const wrap = document.getElementById("episodes");
  wrap.innerHTML = "";

  episodes.forEach((ep, i) => {
    const div = document.createElement("div");

    div.className = "episode" + (i === current ? " active" : "");

    const dateText = ep.date
      ? timeAgo(new Date(ep.date))
      : "";

    div.innerHTML = `
      <img src="${ep.thumbnail}">
      <div class="episode-content">
        <div class="episode-title">
          ${ep.title}
        </div>
        <div class="episode-meta">
          <div>${dateText}</div>
          <div>${ep.duration || "..."}</div>
        </div>
      </div>
    `;

    div.onclick = () => loadEpisode(i);
    wrap.appendChild(div);
  });
}

function loadEpisode(index) {
  current = index;
  renderEpisodes();

  const ep = episodes[index];

  document.getElementById("heroImage").src = ep.thumbnail;
  document.getElementById("title").innerText = ep.title;

  if (window.hlsInstance) {
    window.hlsInstance.destroy();
  }

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(ep.playlist);
    hls.attachMedia(audio);
    window.hlsInstance = hls;
  } else {
    audio.src = ep.playlist;
  }

  audio.play();
}

function loadAllDurations() {
  episodes.forEach((ep, index) => {
    const tempAudio = document.createElement("audio");

    if (Hls.isSupported()) {
      const hls = new Hls();

      hls.loadSource(ep.playlist);
      hls.attachMedia(tempAudio);

      tempAudio.addEventListener("loadedmetadata", () => {
        episodes[index].duration = formatTime(tempAudio.duration);
        renderEpisodes();
        hls.destroy();
      });

      tempAudio.addEventListener("error", () => {
        episodes[index].duration = "";
        renderEpisodes();
        hls.destroy();
      });

    } else {
      tempAudio.src = ep.playlist;

      tempAudio.addEventListener("loadedmetadata", () => {
        episodes[index].duration = formatTime(tempAudio.duration);
        renderEpisodes();
      });

      tempAudio.addEventListener("error", () => {
        episodes[index].duration = "";
        renderEpisodes();
      });
    }
  });
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

function nextTrack() {
  current++;

  if (current >= episodes.length) {
    current = 0;
  }

  loadEpisode(current);
}

function prevTrack() {
  current--;

  if (current < 0) {
    current = episodes.length - 1;
  }

  loadEpisode(current);
}

audio.addEventListener("play", () => {
  document.getElementById("playPauseBtn").innerText = "Pause";
});

audio.addEventListener("pause", () => {
  document.getElementById("playPauseBtn").innerText = "Play";
});

audio.addEventListener("ended", () => {
  document.getElementById("playPauseBtn").innerText = "Play";
  nextTrack();
});

audio.addEventListener("timeupdate", () => {
  progress.value = audio.currentTime;

  document.getElementById("currentTime").innerText =
    formatTime(audio.currentTime);
});

audio.addEventListener("loadedmetadata", () => {
  progress.max = audio.duration;

  document.getElementById("duration").innerText =
    formatTime(audio.duration);

  episodes[current].duration =
    formatTime(audio.duration);

  renderEpisodes();
});

progress.addEventListener("input", () => {
  audio.currentTime = progress.value;
});

loadFeed();
</script>

</body>
</html>
